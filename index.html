<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6e6">
<title>やさしいナンプレ</title>
<meta name="description" content="広告なし・登録なし・ずっと無料。ねこと いっしょに、1面ずつ たのしく とける ナンプレ(数独)です。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ナンプレ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="やさしいナンプレ">
<meta property="og:description" content="広告なし・登録なし・ずっと無料。ねこと いっしょに、1面ずつ たのしく とける ナンプレ(数独)です。">
<meta property="og:image" content="https://roguepink.github.io/nanpure/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    color-scheme: light;
    --bg: #fff6e6; --bg2: #ffe9c9; --card: #ffffff; --ink: #2a2d4f; --muted: #6b6f8f;
    --frame: #33386b; --thin: #cdd2e6; --given: #2a2d4f; --mine: #2766d6;
    --sel: #ffd65c; --rel: #eef1fb; --same: #ffe7b3; --bad: #e0443e; --bad-bg: #ffe1df;
    --green: #1f9a5a; --green-dark: #127343; --orange: #ff9a3c; --orange-dark: #d8741c;
    --hint: #d9f5e3;
    --cell: 40px;
    --font: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(120% 80% at 50% 0%, #fffaf1 0%, var(--bg) 55%, var(--bg2) 100%) fixed; background-color: var(--bg);
    color: var(--ink); font-family: var(--font); word-break: keep-all; overflow-wrap: anywhere; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid var(--mine); outline-offset: 2px; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px); }
  .screen.on { display: flex; }

  /* ── はじめの画面 ── */
  #home { justify-content: center; gap: 14px; overflow-y: auto; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mascot { font-size: 84px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.08)); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .say { position: relative; background: #fff; border: 3px solid var(--frame); border-radius: 18px; padding: 8px 16px; font-weight: 800; font-size: 19px; }
  .say::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--frame); border-bottom: 0; }
  .logo { margin: 6px 0 0; font-size: clamp(38px, 11vw, 56px); font-weight: 900; letter-spacing: .04em; line-height: 1.1; text-align: center; }
  .logo small { display: block; font-size: .38em; letter-spacing: .25em; color: var(--muted); font-weight: 800; margin-bottom: 4px; }
  .mini-grid { display: grid; grid-template-columns: repeat(3, 26px); gap: 3px; margin: 6px auto 0; }
  .mini-grid span { width: 26px; height: 26px; border-radius: 6px; background: #fff; border: 2px solid var(--frame);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; }
  .mini-grid span.b { background: var(--sel); }
  .rule { margin: 0; max-width: 21em; text-align: center; font-size: 17px; line-height: 1.6; color: var(--ink); font-weight: 700; }
  .big { display: flex; flex-direction: column; align-items: center; justify-content: center; width: min(340px, 88vw); min-height: 78px;
    border-radius: 24px; background: var(--green); color: #fff; font-size: 28px; font-weight: 900; letter-spacing: .06em;
    box-shadow: 0 6px 0 var(--green-dark); transition: transform .08s; }
  .big small { font-size: 16px; font-weight: 800; letter-spacing: .02em; opacity: .95; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
  .big.sub { background: #fff; color: var(--ink); border: 3px solid var(--frame); box-shadow: 0 5px 0 var(--frame); min-height: 64px; font-size: 22px; }
  .big.sub:active { box-shadow: 0 1px 0 var(--frame); }
  .friends { width: min(340px, 88vw); background: rgba(255,255,255,.75); border: 3px dashed #e5c792; border-radius: 20px; padding: 10px 12px; text-align: center; }
  .friends b { font-size: 16px; }
  .friends .row { font-size: 30px; line-height: 1.25; letter-spacing: 2px; word-break: break-all; margin-top: 2px; }
  .friends .next { font-size: 15px; color: var(--muted); font-weight: 700; }
  .free { font-size: 14px; color: var(--muted); font-weight: 800; letter-spacing: .05em; }

  /* ── 上の帯 ── */
  .bar { width: 100%; max-width: 760px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 52px; }
  #btnSound { font-size: 24px; }
  .bar > :first-child { justify-self: start; } .bar > :last-child { justify-self: end; }
  .pill { min-width: 56px; height: 48px; padding: 0 14px; border-radius: 16px; background: #fff; border: 3px solid var(--frame);
    font-weight: 900; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 3px 0 var(--frame); }
  .pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--frame); }
  .bar h2 { margin: 0; font-size: 23px; font-weight: 900; text-align: center; line-height: 1.15; }
  .bar h2 small { display: block; font-size: 14px; color: var(--muted); font-weight: 800; }

  /* ── ステージを えらぶ ── */
  #map .scroll { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 4px 20px; }
  .stars-total { text-align: center; font-weight: 900; font-size: 18px; margin: 2px 0 10px; }
  .stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .st { aspect-ratio: 1; border-radius: 22px; background: #fff; border: 3px solid var(--frame); box-shadow: 0 4px 0 var(--frame);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; line-height: 1.1; }
  .st small { font-size: 14px; color: #f0a800; letter-spacing: 1px; }
  .st.now { background: var(--sel); animation: pulse 1.6s ease-in-out infinite; }
  .st.lock { background: #eceaf3; color: #a9a8bd; border-color: #c9c7d8; box-shadow: none; font-size: 20px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* ── あそぶ画面 ── */
  #play { padding-left: 8px; padding-right: 8px; }
  #play .main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .talk { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; min-height: 64px; }
  .talk .cat { font-size: 44px; line-height: 1; flex: none; }
  .talk .cat.jump { animation: jump .5s ease; }
  @keyframes jump { 0% { transform: translateY(0); } 40% { transform: translateY(-14px) scale(1.1); } 100% { transform: translateY(0); } }
  .talk .msg { flex: 1; position: relative; background: #fff; border: 3px solid var(--frame); border-radius: 16px; padding: 6px 12px;
    font-weight: 800; font-size: 17px; line-height: 1.45; min-height: 56px; display: flex; align-items: center; }
  .talk .msg::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right-color: var(--frame); border-left: 0; }
  .talk .msg.bad { background: var(--bad-bg); }
  .talk .msg.good { background: #e9f9ef; }
  .boardWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .board { display: grid; grid-template-columns: repeat(9, var(--cell)); grid-template-rows: repeat(9, var(--cell));
    background: var(--frame); border: 4px solid var(--frame); border-radius: 12px; gap: 1px; overflow: hidden;
    box-shadow: 0 8px 0 rgba(51,56,107,.18); }
  .c { position: relative; background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .64); font-weight: 800; color: var(--mine); line-height: 1; touch-action: manipulation; cursor: pointer; }
  .c.g { color: var(--given); font-weight: 900; }
  .c.bx { margin-right: 2px; } .c.by { margin-bottom: 2px; }
  .c.rel { background: var(--rel); }
  .c.same { background: var(--same); }
  .c.sel { background: var(--sel); }
  .c.hintu { background: var(--hint); }
  .c.bad { color: var(--bad); background: var(--bad-bg); animation: shake .4s; }
  .c.pop span.v { display: inline-block; animation: pop .35s ease; }
  .c.wave { animation: wave .7s ease both; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes wave { 0% { background: #fff; } 35% { background: #9ee6b9; transform: scale(.92); } 100% { transform: scale(1); } }
  .notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    font-size: calc(var(--cell) * .3); font-weight: 800; color: #5d6290; }
  .notes i { font-style: normal; display: flex; align-items: center; justify-content: center; }

  .controls { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tool { height: 54px; border-radius: 16px; background: #fff; border: 3px solid var(--frame); box-shadow: 0 3px 0 var(--frame);
    font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--frame); }
  .tool .ic { font-size: 22px; }
  .tool.on { background: var(--orange); color: #fff; border-color: var(--orange-dark); box-shadow: 0 3px 0 var(--orange-dark); }
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .num { height: 64px; border-radius: 16px; background: var(--frame); color: #fff; font-size: 34px; font-weight: 900;
    box-shadow: 0 4px 0 #1d2046; display: flex; align-items: center; justify-content: center; position: relative; }
  .num:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d2046; }
  .num.done { background: #d8dae8; color: #9b9fbd; box-shadow: 0 4px 0 #b9bcd3; }
  .num.done::after { content: "✓"; position: absolute; top: 2px; right: 7px; font-size: 16px; color: var(--green); }
  .num.memo { background: var(--orange); box-shadow: 0 4px 0 var(--orange-dark); }
  .num.erase { background: #fff; color: var(--ink); border: 3px solid var(--frame); font-size: 18px; box-shadow: 0 4px 0 var(--frame); flex-direction: column; line-height: 1.1; }
  .num.erase .ic { font-size: 22px; }

  @media (max-height: 720px) {
    .num { height: 54px; font-size: 30px; } .tool { height: 46px; font-size: 17px; } .tool .ic { font-size: 19px; }
    .talk { min-height: 50px; } .talk .cat { font-size: 36px; } .talk .msg { min-height: 48px; font-size: 16px; padding: 4px 10px; }
    .bar { min-height: 46px; } .pill { height: 44px; } .bar h2 { font-size: 21px; }
    #play .main { gap: 6px; } .controls, .pad, .tools { gap: 6px; }
  }
  @media (max-height: 600px) {
    .num { height: 48px; font-size: 28px; } .tool { height: 42px; } .talk .cat { font-size: 30px; } .talk .msg { font-size: 15px; min-height: 44px; }
  }
  /* 横長の画面(タブレット・パソコン・横向き)では 盤面を左、ボタンを右に */
  body.wide #play .main { flex-direction: row; justify-content: center; align-items: stretch; gap: 20px; }
  body.wide #play .side { display: flex; flex: none; flex-direction: column; justify-content: center; gap: 12px; width: 400px; }
  body.wide #play .boardWrap { flex: 0 0 auto; width: auto; }
  body.wide .talk { max-width: none; }
  #play .side { display: contents; }

  /* ── クリア ── */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(42,45,79,.45); z-index: 20; padding: 16px; }
  .overlay.on { display: flex; }
  .card { width: min(380px, 100%); background: #fff; border: 4px solid var(--frame); border-radius: 28px; padding: 20px 18px 22px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 10px 0 rgba(0,0,0,.15); animation: rise .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h3 { margin: 0; font-size: 30px; font-weight: 900; }
  .card .stars { font-size: 50px; letter-spacing: 6px; line-height: 1; }
  .card .stars span { display: inline-block; color: #e6e3ef; }
  .card .stars span.on { color: #ffbf1f; animation: star .5s cubic-bezier(.2,1.6,.4,1) both; text-shadow: 0 3px 0 #d79700; }
  @keyframes star { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .card p { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.6; }
  .card .newf { background: #fff4d6; border-radius: 18px; padding: 10px 14px; font-weight: 800; font-size: 18px; }
  .card .newf .e { display: block; font-size: 60px; line-height: 1.1; animation: jump .8s ease .3s both; }
  .card .big { width: 100%; }
  .linkbtn { font-size: 18px; font-weight: 800; color: var(--muted); padding: 8px 12px; text-decoration: underline; }
  #rules .card { text-align: left; align-items: stretch; }
  #rules .card h3 { text-align: center; }
  #rules ol { margin: 0; padding-left: 1.4em; font-size: 18px; font-weight: 700; line-height: 1.6; }
  #rules li { margin-bottom: 6px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
</style>
</head>
<body>

<!-- はじめの画面 -->
<section id="home" class="screen on" aria-label="はじめの画面">
  <div class="hero">
    <div class="say" id="homeSay">いっしょに あそぼう!</div>
    <div class="mascot" aria-hidden="true">🐱</div>
    <h1 class="logo"><small>ねこと いっしょに</small>やさしいナンプレ</h1>
  </div>
  <p class="rule">たて・よこ・太い線の四角 に、<br>1〜9 の 数字を 1つずつ いれよう</p>
  <button class="big" id="btnGo" type="button"><span id="goMain">はじめる</span><small id="goSub">ステージ 1</small></button>
  <button class="big sub" id="btnMap" type="button">ステージを えらぶ</button>
  <div class="friends" id="friends"></div>
  <div class="free">広告なし ・ 登録なし ・ ずっと無料</div>
</section>

<!-- ステージを えらぶ -->
<section id="map" class="screen" aria-label="ステージを えらぶ">
  <div class="bar">
    <button class="pill" id="mapBack" type="button">← もどる</button>
    <h2>ステージ</h2>
    <span></span>
  </div>
  <div class="scroll" id="mapScroll">
    <div class="stars-total" id="starsTotal"></div>
    <div class="stages" id="stages"></div>
  </div>
</section>

<!-- あそぶ画面 -->
<section id="play" class="screen" aria-label="ナンプレ">
  <div class="bar">
    <button class="pill" id="playBack" type="button" aria-label="はじめの画面へ">← もどる</button>
    <h2 id="stageTitle">ステージ 1<small>とても やさしい</small></h2>
    <button class="pill" id="btnSound" type="button" aria-label="音">🔊</button>
  </div>
  <div class="main">
    <div class="boardWrap" id="boardWrap"><div class="board" id="board" role="grid" aria-label="ナンプレの盤"></div></div>
    <div class="side">
      <div class="talk"><div class="cat" id="cat" aria-hidden="true">🐱</div><div class="msg" id="msg" aria-live="polite"></div></div>
      <div class="controls">
        <div class="tools">
          <button class="tool" id="btnHint" type="button"><span class="ic">💡</span>ヒント</button>
          <button class="tool" id="btnMemo" type="button"><span class="ic">✏️</span><span id="memoLabel">メモ</span></button>
          <button class="tool" id="btnRules" type="button"><span class="ic">❓</span>ルール</button>
        </div>
        <div class="pad" id="pad"></div>
      </div>
    </div>
  </div>
</section>

<!-- クリア -->
<div class="overlay" id="clear" role="dialog" aria-label="クリア">
  <div class="card">
    <h3 id="clearTitle">クリア!</h3>
    <div class="stars" id="clearStars"><span>★</span><span>★</span><span>★</span></div>
    <p id="clearInfo"></p>
    <div class="newf" id="clearFriend" hidden></div>
    <button class="big" id="btnNext" type="button">つぎの ステージへ</button>
    <button class="linkbtn" id="btnHome" type="button">はじめの画面へ</button>
  </div>
</div>

<!-- ルール -->
<div class="overlay" id="rules" role="dialog" aria-label="ルール">
  <div class="card">
    <h3>ナンプレの ルール</h3>
    <ol>
      <li>よこの列に、1〜9 が 1つずつ</li>
      <li>たての列に、1〜9 が 1つずつ</li>
      <li>太い線の四角にも、1〜9 が 1つずつ</li>
      <li>マスを えらんで、下の数字を おす</li>
    </ol>
    <p style="font-size:16px;color:var(--muted)">まちがえても だいじょうぶ。こまったら 💡ヒント。<br>✏️メモ は、小さく 書いておける 下書きです。</p>
    <button class="big" id="rulesOk" type="button">わかった</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script src="engine.js"></script>
<script>
'use strict';
/* やさしいナンプレ(画面と操作)。問題づくりは engine.js。
   - 進みぐあいは この端末の中だけに 保存(登録なし・送信なし)
   - 同じ面は 二度と出ない(ステージ番号ごとに ちがう問題。念のため 一度出た面の印を 覚えて、ぶつかったら 作りなおす) */
var SAVE_KEY = 'nanpure-v1';
var FRIENDS = ['🐶', '🐰', '🐻', '🐼', '🐨', '🐹', '🦊', '🐸', '🐧', '🐥', '🐷', '🐮', '🐵', '🦁', '🐯', '🐿️', '🦔', '🦉', '🐢', '🐳',
  '🐬', '🐙', '🦀', '🐠', '🦋', '🐞', '🐝', '🦄', '🐘', '🦒', '🦘', '🦩', '🦜', '🐑', '🐴', '🐓', '🦦', '🦥', '🐊', '🐉'];
var FRIEND_EVERY = 3;                                  // 3面 クリアするごとに、なかまが 1人ふえる
var PRAISE = ['いいね!', 'そのちょうし!', 'すごい!', 'ぴったり!', 'にゃいす!', 'じょうず!', 'さすが!', 'ばっちり!'];
var OOPS = ['おしい! ほかの数字かも', 'だいじょうぶ、もういちど!', 'あれれ? ちがうみたい', 'うーん、ちがうみたい'];

var S = load();
var cur = null;              // いま あそんでいる面
var sel = -1;                // えらんでいる マス
var memo = false;            // メモ書きモード
var badCell = -1, badTimer = 0, hintUnit = -1, hintTimer = 0, idleTimer = 0, lastTick = 0;
var $ = function (id) { return document.getElementById(id); };

function load() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  d = d && typeof d === 'object' ? d : {};
  return { unlocked: d.unlocked || 1, cleared: d.cleared || {}, variants: d.variants || {}, keys: d.keys || {},
    sound: d.sound !== false, cur: d.cur || null, rulesSeen: !!d.rulesSeen };
}
function save() {
  S.cur = cur;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function clearedCount() { return Object.keys(S.cleared).length; }
function friendsOwned() { return Math.min(FRIENDS.length, Math.floor(clearedCount() / FRIEND_EVERY)); }

/* ── 画面の切りかえ ── */
function show(id) {
  ['home', 'map', 'play'].forEach(function (s) { $(s).classList.toggle('on', s === id); });
  if (id === 'home') renderHome();
  if (id === 'map') renderMap();
  if (id === 'play') { layout(); render(); }
}

function renderHome() {
  var resume = cur && !cur.done;
  var n = resume ? cur.stage : S.unlocked;
  $('goMain').textContent = (S.unlocked === 1 && !resume) ? 'はじめる' : 'つづける';

  bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99999;background:#fffaf0;color:#2a2d4f;border:3px solid #2a2d4f;border-radius:14px;padding:10px 44px 10px 12px;font:700 15px/1.55 system-ui,sans-serif';
  bar.textContent = 'LINEの中だと 画面が小さめです。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、大きく遊べて、ホーム画面にも入れられます。';
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
  x.style.cssText = 'position:absolute;top:4px;right:6px;width:40px;height:40px;border:0;background:none;font:900 24px/1 system-ui;color:#2a2d4f;cursor:pointer';
  x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); });
  bar.appendChild(x); addEventListener('load', function () { document.body.appendChild(bar); });
})();

// ホーム画面に入れられる(アプリのように開く)ための登録
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
